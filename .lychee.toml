# Non-blocking-friendly defaults for flaky creator-platform domains.
# Workflow also sets continue-on-error / fail: false.
verbose = "info"
cache = true
max_cache_age = "2d"
max_concurrency = 4
timeout = 20
accept = [200, 204, 206, 429, 403]
exclude_path = ["node_modules", "docs/.vitepress/dist"]

# Domains that often rate-limit, require login, or return soft blocks to CI bots
exclude = [
  '^https://www\.youtube\.com/',
  '^https://studio\.youtube\.com/',
  '^https://m\.youtube\.com/',
  '^https://youtu\.be/',
  '^https://support\.google\.com/youtube/',
  '^https://blog\.youtube/',
  '^https://www\.tubebuddy\.com/',
  '^https://socialblade\.com/',
  '^https://vidiq\.com/',
  '^https://creativecommons\.org/',
  '.*\.github\.io/youtube-starter-bible',
  '^#',
  '^mailto:',
]
